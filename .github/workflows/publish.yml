name: Publish

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/tesserix/ai-agents
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

  registry:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Publish reviewed Agent manifests
        env:
          REGISTRY_DEPLOY_KEY: ${{ secrets.AGENTIC_REGISTRY_DEPLOY_KEY }}
          REGISTRY_PUBLISH_URL: https://publish-aregistry.tesserix.app/v0/apply
        run: |
          set -euo pipefail
          if ! [[ "${REGISTRY_DEPLOY_KEY}" =~ ^[[:xdigit:]]{64}$ ]]; then
            echo "registry deploy key must be a 64-character hexadecimal value" >&2
            exit 1
          fi
          oidc_response=$(curl --silent --show-error --fail-with-body \
            -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=agentregistry-publisher.tesserix.app")
          github_oidc_token=$(jq -er '.value' <<<"${oidc_response}")
          response_file=$(mktemp)
          trap 'unset github_oidc_token oidc_response; rm -f "${response_file}"' EXIT
          for manifest in registry/*.yaml; do
            status=$(curl --silent --show-error \
              --retry 3 --retry-all-errors --max-time 30 \
              -H "User-Agent: Tesserix-Agent-Publisher/1.0 (+https://github.com/tesserix/ai-agents)" \
              -H "Accept: application/json" \
              -H "X-GitHub-OIDC-Token: Bearer ${github_oidc_token}" \
              -H "X-Agentic-Registry-Deploy-Key: ${REGISTRY_DEPLOY_KEY}" \
              -H "Content-Type: application/yaml" \
              --data-binary "@${manifest}" \
              --output "${response_file}" \
              --write-out '%{http_code}' \
              "${REGISTRY_PUBLISH_URL}")
            case "${status}" in
              200) ;;
              207)
                if ! jq -e 'all(.applied[]?; (.error // "") == "")' \
                  "${response_file}" >/dev/null; then
                  echo "registry partially rejected ${manifest}" >&2
                  jq -c '{errors: [.applied[]? | select((.error // "") != "") | {kind, name, namespace, error}]}' \
                    "${response_file}" >&2
                  exit 1
                fi
                ;;
              *)
                echo "registry publish failed for ${manifest} with HTTP ${status}" >&2
                cat "${response_file}" >&2
                exit 1
                ;;
            esac
          done
