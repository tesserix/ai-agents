name: Publish

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: kora-runtime
            image: ghcr.io/tesserix/ai-agents
          - target: sre-runtime
            image: ghcr.io/tesserix/ai-agents-sre
          - target: orchestrator-runtime
            image: ghcr.io/tesserix/ai-agents-orchestrator
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          target: ${{ matrix.target }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

  registry:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Verify inside the image production runs: the ADK comes from the base, not the lock.
    container:
      image: ghcr.io/tesserix/base-python-adk-3.14:weekly@sha256:4e38ff684b5c9936b855cac13aa71db619de23bca6d379d01e6156c4f402a56b
      options: --user root
    env:
      UV_PROJECT_ENVIRONMENT: /opt/adk-venv
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.5"
          enable-cache: true
      - run: uv sync --frozen --inexact
      # No manifest reaches the registry unless every evaluation case still holds.
      - name: Gate the publish on the evaluation suite
        run: uv run --no-sync python -m sre_agent.evaluation evals/sre-investigator.yaml
      - name: Publish reviewed Agent manifests
        env:
          REGISTRY_DEPLOY_KEY: ${{ secrets.AGENTIC_REGISTRY_DEPLOY_KEY }}
          REGISTRY_SRE_DEPLOY_KEY: ${{ secrets.AGENTIC_REGISTRY_SRE_DEPLOY_KEY }}
          REGISTRY_PUBLISH_URL: https://publish-aregistry.tesserix.app/v0/apply
        run: |
          set -eu
          valid_deploy_key() {
            deploy_key_candidate=$1
            case "${#deploy_key_candidate}" in
              64)
                case "${deploy_key_candidate}" in *[!0-9A-Fa-f]*) return 1 ;; esac
                ;;
              72)
                case "${deploy_key_candidate}" in *[!A-Za-z0-9_-]*) return 1 ;; esac
                ;;
              *) return 1 ;;
            esac
          }
          if ! valid_deploy_key "${REGISTRY_DEPLOY_KEY}"; then
            echo "registry deploy key must be 64-character hex or 72-character URL-safe" >&2
            exit 1
          fi
          if ! valid_deploy_key "${REGISTRY_SRE_DEPLOY_KEY}"; then
            echo "registry deploy key must be 64-character hex or 72-character URL-safe" >&2
            exit 1
          fi
          oidc_response=$(curl --silent --show-error --fail-with-body \
            -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=agentregistry-publisher.tesserix.app")
          github_oidc_token=$(printf '%s' "${oidc_response}" | \
            python -c 'import json, sys; print(json.load(sys.stdin)["value"])')
          response_file=$(mktemp)
          trap 'unset github_oidc_token oidc_response; rm -f "${response_file}"' EXIT
          for manifest in registry/*.yaml; do
            case "${manifest}" in
              registry/sre-investigator.yaml|registry/supervisor.yaml|registry/orchestrator.yaml) deploy_key="${REGISTRY_SRE_DEPLOY_KEY}" ;;
              *) deploy_key="${REGISTRY_DEPLOY_KEY}" ;;
            esac
            publish_http_code=$(curl --silent --show-error \
              --retry 3 --retry-all-errors --max-time 30 \
              -H "User-Agent: Tesserix-Agent-Publisher/1.0 (+https://github.com/tesserix/ai-agents)" \
              -H "Accept: application/json" \
              -H "X-GitHub-OIDC-Token: Bearer ${github_oidc_token}" \
              -H "X-Agentic-Registry-Deploy-Key: ${deploy_key}" \
              -H "Content-Type: application/yaml" \
              --data-binary "@${manifest}" \
              --output "${response_file}" \
              --write-out '%{http_code}' \
              "${REGISTRY_PUBLISH_URL}")
            case "${publish_http_code}" in
              200) ;;
              207)
                if ! python - "${response_file}" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as response:
              document = json.load(response)
          errors = [
              {key: entry.get(key) for key in ("kind", "name", "namespace", "error")}
              for entry in document.get("applied") or []
              if entry.get("error")
          ]
          if errors:
              print(json.dumps({"errors": errors}, separators=(",", ":")), file=sys.stderr)
              raise SystemExit(1)
          PY
                then
                  echo "registry partially rejected ${manifest}" >&2
                  exit 1
                fi
                ;;
              *)
                echo "registry publish failed for ${manifest} with HTTP ${publish_http_code}" >&2
                cat "${response_file}" >&2
                exit 1
                ;;
            esac
          done
