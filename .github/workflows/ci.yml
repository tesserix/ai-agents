name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    uses: tesserix/tesserix-workflows/.github/workflows/python-baked-deps-ci.yml@8a269caaf014b3e053a29b40902484236323414a
    with:
      container_image: ghcr.io/tesserix/base-python-adk-3.14:20260904@sha256:4e38ff684b5c9936b855cac13aa71db619de23bca6d379d01e6156c4f402a56b
      uv_version: "0.12.5"
      source_directory: src
      coverage_min_lines: 90

  secret-scan:
    uses: tesserix/tesserix-workflows/.github/workflows/secret-scan.yml@8a269caaf014b3e053a29b40902484236323414a
