name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    uses: tesserix/tesserix-workflows/.github/workflows/python-baked-deps-ci.yml@8a269caaf014b3e053a29b40902484236323414a
    with:
      container_image: ghcr.io/tesserix/base-python-adk-3.14:20260829@sha256:5a6fd1863ed7f37f3929cc596d0ec063c3077c11713cd334f14d1df2b30ef386
      uv_version: "0.12.5"
      source_directory: src
      coverage_min_lines: 90

  secret-scan:
    uses: tesserix/tesserix-workflows/.github/workflows/secret-scan.yml@8a269caaf014b3e053a29b40902484236323414a
