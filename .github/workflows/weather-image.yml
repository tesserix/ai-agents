name: Roamie weather image
on:
  workflow_dispatch:
  pull_request:
    paths:
      - docker/open-meteo/**
      - .github/workflows/weather-image.yml
permissions:
  contents: read
concurrency:
  group: roamie-weather-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    uses: ./.github/workflows/ci.yml
  image:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c
      - name: Build pinned upstream runtime
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          file: docker/open-meteo/Dockerfile
          tags: roamie-weather:qa
          load: true
          push: false
          cache-from: type=gha,scope=roamie-weather
          cache-to: type=gha,scope=roamie-weather,mode=max
      - name: Require real global forecasts, not merely an HTTP server
        run: |
          docker run --detach --name weather-qa --read-only --cap-drop ALL \
            --security-opt no-new-privileges --memory 5g --cpus 2 \
            --tmpfs /app/data:rw,uid=999,gid=999,size=2g \
            --tmpfs /app/tmp:rw,uid=999,gid=999,size=64m \
            --tmpfs /tmp:rw,uid=999,gid=999,size=64m \
            -e CACHE_SIZE=512MB -p 127.0.0.1:18080:8080 roamie-weather:qa
          python3 docker/open-meteo/smoke.py
      - if: always()
        name: Stop disposable QA container
        run: docker stop weather-qa || true
      - if: github.event_name == 'workflow_dispatch'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: github.event_name == 'workflow_dispatch'
        name: Publish only the validated build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          file: docker/open-meteo/Dockerfile
          push: true
          tags: ghcr.io/tesserix/roamie-weather:sha-${{ github.sha }}
          provenance: mode=max
          sbom: true
