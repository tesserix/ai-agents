[project]
name = "kora-ai-agents"
version = "0.1.0"
description = "Kora AI agents built with the Tesserix ADK"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "structlog>=25.4,<26",
  "uvicorn>=0.35,<1",
]

[dependency-groups]
dev = [
  "mypy>=1.18,<2",
  "pytest>=9,<10",
  "pytest-asyncio>=1.2,<2",
  "pytest-cov>=7,<8",
  "pyyaml>=6,<7",
  "ruff>=0.14,<0.15",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kora_agents"]


[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--strict-markers"

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["kora_agents"]
plugins = ["pydantic.mypy"]

[tool.coverage.run]
source = ["kora_agents"]
branch = true
omit = ["src/kora_agents/main.py"]

[tool.coverage.report]
fail_under = 90
show_missing = true
