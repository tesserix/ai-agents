[project]
name = "kora-ai-agents"
version = "0.1.0"
description = "Kora AI agents built with the Tesserix ADK"
requires-python = ">=3.14"
dependencies = [
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "opentelemetry-exporter-otlp-proto-http>=1.36,<2",
  "opentelemetry-sdk>=1.36,<2",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "structlog>=25.4,<26",
  "temporalio>=1.32,<2",
  "uvicorn>=0.35,<1",
]

[dependency-groups]
dev = [
  "mypy>=1.18,<2",
  "pytest>=9,<10",
  "pytest-asyncio>=1.2,<2",
  "pytest-cov>=7,<8",
  "pyyaml>=6,<7",
  "ruff>=0.14,<0.15",
  "types-pyyaml>=6,<7",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_telemetry", "src/kora_agents", "src/sre_agent", "src/orchestrator_agent"]


[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--strict-markers"

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
python_version = "3.14"
strict = true
packages = ["agent_telemetry", "kora_agents", "sre_agent", "orchestrator_agent"]
plugins = ["pydantic.mypy"]

[tool.coverage.run]
source = ["agent_telemetry", "kora_agents", "sre_agent", "orchestrator_agent"]
branch = true
omit = [
  "src/kora_agents/main.py",
  "src/sre_agent/main.py",
  "src/orchestrator_agent/main.py",
  "src/orchestrator_agent/worker.py",
]

[tool.coverage.report]
fail_under = 90
show_missing = true
