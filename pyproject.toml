[project]
name = "kora-ai-agents"
version = "0.1.0"
description = "Kora AI agents built with the Tesserix ADK"
requires-python = ">=3.14"
dependencies = [
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  # Patch the Google ADK transitive inherited from the pinned base.
  "msgpack>=1.1.3,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.36,<2",
  "opentelemetry-sdk>=1.36,<2",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "structlog>=26.1,<27",
  "temporalio>=1.32,<2",
  "uvicorn>=0.35,<1",
]

[dependency-groups]
dev = [
  "httpx2>=2.13.1",
  "mypy>=2.3,<3",
  "pytest>=9,<10",
  "pytest-asyncio>=1.2,<2",
  "pytest-cov>=7,<8",
  "pyyaml>=6,<7",
  "ruff>=0.16,<0.17",
  "types-pyyaml>=6,<7",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
  "src/agent_telemetry",
  "src/document_agent",
  "src/kora_agents",
  "src/sre_agent",
  "src/orchestrator_agent",
  "src/roamie_agents",
]


[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--strict-markers"

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.per-file-target-version]
"docker/open-meteo/*.py" = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
python_version = "3.14"
strict = true
packages = ["agent_telemetry", "document_agent", "kora_agents", "sre_agent", "orchestrator_agent", "roamie_agents"]
plugins = ["pydantic.mypy"]

[tool.coverage.run]
source = ["agent_telemetry", "document_agent", "kora_agents", "sre_agent", "orchestrator_agent", "roamie_agents"]
branch = true
omit = [
  "src/kora_agents/main.py",
  "src/sre_agent/main.py",
  "src/orchestrator_agent/main.py",
  "src/orchestrator_agent/worker.py",
  "src/roamie_agents/main.py",
  "src/roamie_agents/manager_main.py",
]

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.uv]
# google-adk 2.11 in the ADK base requires <=1.42.1. Remove when its cap lifts.
constraint-dependencies = ["opentelemetry-api<=1.42.1", "opentelemetry-sdk<=1.42.1"]
