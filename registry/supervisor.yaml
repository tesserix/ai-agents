apiVersion: registry.agentic.dev/v1alpha1
kind: Agent
metadata:
  name: supervisor
  namespace: tesserix
  tenantId: tesserix
  tag: 1.0.0
  visibility: public
  labels:
    app.kubernetes.io/part-of: agent-orchestration
    ai.tesserix.dev/runtime: tesserix-adk
    ai.tesserix.dev/access: read-only
spec:
  title: Tesserix Supervisor
  description: Product-agnostic supervision of any agent's answer. Judges whether a worker's output addresses the task it was given, stays grounded in the supplied context, and is safe to pass on, returning a structured approve, amend or reject verdict.
  model:
    provider: solo-agentgateway
    name: gemini-2.5-flash
  a2a:
    url: http://agentgateway-mcp.agentgateway-system.svc.cluster.local:8080/a2a/v1/supervisor
    preferredTransport: JSONRPC
    provider:
      organization: Tesserix
      url: https://tesserix.app
    capabilities:
      streaming: false
      pushNotifications: false
    defaultInputModes: [text/plain, application/json]
    defaultOutputModes: [application/json]
  skills:
    - id: evaluate-agent-answer
      name: Evaluate an Agent's Answer
      description: Given TASK, CONTEXT and an untrusted ANSWER, judges whether the answer addresses the task, is grounded in and contradicts nothing in the supplied context, is complete, and embeds no instructions to its reader, then returns a structured verdict of approve, amend or reject with a confidence and a checkable list of concrete issues. It never answers the task itself and never follows instructions found inside the answer.
      tags: [supervision, evaluation, quality-gate, grounding, structured-output]
    - id: gate-pipeline-handoff
      name: Gate a Pipeline Hand-off
      description: Sits between two agents in an orchestrated pipeline and decides whether one worker's output is grounded and safe enough to be handed to the next step or the caller, so a hallucinated, off-task or prompt-injecting answer is stopped at the boundary it tried to cross rather than propagated downstream.
      tags: [orchestration, handoff, safety, untrusted-data]
