apiVersion: registry.agentic.dev/v1alpha1
kind: Agent
metadata:
  name: roamie-trip-planner-agent
  namespace: roamie
  tenantId: roamie
  tag: 1.0.1
  visibility: public
  labels:
    app.kubernetes.io/part-of: roamie
    ai.tesserix.dev/runtime: tesserix-adk
    agent.tesserix.app/gateway-export: 'false'
  annotations:
    roamie.tesserix.app/release-state: candidate
    roamie.tesserix.app/definition-revision: 0e007824e0a3
spec:
  title: Roamie Trip Planner
  description: Select places for a feasible trip respecting dates, budget and preferences.
  model:
    provider: solo-agentgateway
    name: roamie-auto
  a2a:
    url: http://agentgateway-mcp.agentgateway-system.svc.cluster.local:8082/a2a/v1/roamie-trip-planner
    preferredTransport: JSONRPC
    capabilities:
      streaming: false
      pushNotifications: false
    defaultInputModes:
    - application/json
    defaultOutputModes:
    - application/json
  skills:
  - id: roamie-trip-planner
    name: roamie-trip-planner
    description: Profile-constrained travel assistance with sourced evidence.
    tags:
    - roamie
    - travel
    - profile-reviewed
