apiVersion: registry.agentic.dev/v1alpha1
kind: Agent
metadata:
  name: roamie-currency-exchange-agent
  namespace: roamie
  tenantId: roamie
  tag: 1.0.1
  visibility: public
  labels:
    app.kubernetes.io/part-of: roamie
    ai.tesserix.dev/runtime: tesserix-adk
    agent.tesserix.app/gateway-export: 'false'
  annotations:
    roamie.tesserix.app/release-state: candidate
    roamie.tesserix.app/definition-revision: a151e207bb5a
spec:
  title: Roamie Currency Exchange
  description: Explain deterministic exchange comparisons; preserve all rates and
    fees.
  model:
    provider: solo-agentgateway
    name: roamie-auto
  a2a:
    url: http://agentgateway-mcp.agentgateway-system.svc.cluster.local:8082/a2a/v1/roamie-currency-exchange
    preferredTransport: JSONRPC
    capabilities:
      streaming: false
      pushNotifications: false
    defaultInputModes:
    - application/json
    defaultOutputModes:
    - application/json
  skills:
  - id: roamie-currency-exchange
    name: roamie-currency-exchange
    description: Profile-constrained travel assistance with sourced evidence.
    tags:
    - roamie
    - travel
    - profile-reviewed
