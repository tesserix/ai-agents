apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: roamie-agents
  namespace: agentgateway-system
spec:
  parentRefs:
  - name: agentgateway-mcp
    sectionName: runtime
  rules:
  - matches:
    - path:
        type: Exact
        value: /a2a/v1/roamie-currency-exchange
    backendRefs:
    - group: agentgateway.dev
      kind: AgentgatewayBackend
      name: roamie-agents
  - matches:
    - path:
        type: Exact
        value: /a2a/v1/roamie-trip-planner
    backendRefs:
    - group: agentgateway.dev
      kind: AgentgatewayBackend
      name: roamie-agents
  - matches:
    - path:
        type: Exact
        value: /a2a/v1/roamie-food
    backendRefs:
    - group: agentgateway.dev
      kind: AgentgatewayBackend
      name: roamie-agents
  - matches:
    - path:
        type: Exact
        value: /a2a/v1/roamie-routes
    backendRefs:
    - group: agentgateway.dev
      kind: AgentgatewayBackend
      name: roamie-agents
  - matches:
    - path:
        type: Exact
        value: /a2a/v1/roamie-activities
    backendRefs:
    - group: agentgateway.dev
      kind: AgentgatewayBackend
      name: roamie-agents
  - matches:
    - path:
        type: Exact
        value: /a2a/v1/roamie-shopping
    backendRefs:
    - group: agentgateway.dev
      kind: AgentgatewayBackend
      name: roamie-agents
  - matches:
    - path:
        type: Exact
        value: /a2a/v1/roamie-memories
    backendRefs:
    - group: agentgateway.dev
      kind: AgentgatewayBackend
      name: roamie-agents
