apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: roamie-model
  namespace: agentgateway-system
spec:
  parentRefs:
  - name: ai-gateway
    sectionName: http
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /roamie
    filters:
    - type: URLRewrite
      urlRewrite:
        path:
          type: ReplacePrefixMatch
          replacePrefixMatch: /
    backendRefs:
    - group: agentgateway.dev
      kind: AgentgatewayBackend
      name: roamie-model
